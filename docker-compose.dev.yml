# Stos dev. Wymaga repo-rodzenstwa: ../silo-server i ../silo-web.
# Szkic docelowy: ARCHITECTURE_AND_PLAN.md, sekcja 2.1.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: silo
      POSTGRES_PASSWORD: silo # tylko dev
      POSTGRES_DB: silo
    ports: ["${SILO_DEV_PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "silo", "-d", "silo"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Referencyjny serwer IMAP/SMTP (docker-mailserver 16 = Dovecot 2.4). Tylko dev: bez TLS, bez filtrow.
  # Konta dev1-3@silo.test: dev/dms/config/postfix-accounts.cf (hasla: README, sekcja dev).
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:16
    hostname: mail.silo.test
    environment:
      # odchudzenie na potrzeby dev: bez filtrow i podpisow (to nie jest zakres Silo)
      ENABLE_RSPAMD: "0"
      ENABLE_SPAMASSASSIN: "0"
      ENABLE_CLAMAV: "0"
      ENABLE_AMAVIS: "0"
      ENABLE_OPENDKIM: "0"
      ENABLE_OPENDMARC: "0"
      ENABLE_POLICYD_SPF: "0"
      ENABLE_FAIL2BAN: "0"
      PERMIT_DOCKER: network # Postfix przyjmuje poczte z sieci compose bez auth (seed)
      SSL_TYPE: "" # dev bez TLS; dovecot.cf dopuszcza plaintext auth
    volumes:
      - ./dev/dms/config:/tmp/docker-mailserver
      - dms-mail:/var/mail
    ports:
      - "${SILO_DEV_SMTP_PORT:-2525}:25"
      - "${SILO_DEV_IMAP_PORT:-1143}:143"
      - "${SILO_DEV_SUBMISSION_PORT:-1587}:587"

  silo-server:
    build:
      context: ../silo-server
      target: dev
    command: air -c .air.toml
    volumes:
      - ../silo-server:/src
      - blobs:/data/blobs
    environment:
      SILO_HTTP_ADDR: ":8080"
      SILO_LOG_FORMAT: text
      SILO_LOG_LEVEL: debug
      SILO_DATABASE_URL: postgres://silo:silo@postgres:5432/silo?sslmode=disable
      SILO_PUBLIC_URL: http://localhost:${SILO_DEV_WEB_PORT:-5173}
      SILO_SECRET_KEY: ZGV2LW9ubHktZGV2LW9ubHktZGV2LW9ubHktZGV2MzI= # 32 B base64, WYLACZNIE dev
      SILO_AUTH_MODE: imap
      SILO_DEFAULT_IMAP_HOST: mailserver
      SILO_DEFAULT_IMAP_PORT: "143"
      SILO_DEFAULT_IMAP_TLS: none # tylko dev; prod wymaga implicit/starttls
      SILO_DEFAULT_SMTP_HOST: mailserver
      SILO_DEFAULT_SMTP_PORT: "587"
      SILO_DEFAULT_SMTP_TLS: none
      SILO_ALLOW_INSECURE_TRANSPORT: "true" # bez tego `none` jest odrzucane przy starcie
      SILO_SYNC_MAX_CONNECTIONS_PER_ACCOUNT: ${SILO_SYNC_MAX_CONNECTIONS_PER_ACCOUNT:-3}
      SILO_SYNC_INITIAL_CONCURRENCY: ${SILO_SYNC_INITIAL_CONCURRENCY:-2}
      SILO_SYNC_POLL_INTERVAL: ${SILO_SYNC_POLL_INTERVAL:-5m}
      SILO_SYNC_BACKFILL_RATE: ${SILO_SYNC_BACKFILL_RATE:-5MB/s}
      SILO_MIRROR_MAX_MESSAGE_BYTES: ${SILO_MIRROR_MAX_MESSAGE_BYTES:-50MB}
      SILO_MIRROR_QUOTA_PER_ACCOUNT: ${SILO_MIRROR_QUOTA_PER_ACCOUNT:-0}
      SILO_UNDO_WINDOW: ${SILO_UNDO_WINDOW:-10s}
      SILO_MAX_ATTACHMENT_BYTES: ${SILO_MAX_ATTACHMENT_BYTES:-25MB}
      SILO_SYNC_KEYWORD_FOLDER_LIMIT: ${SILO_SYNC_KEYWORD_FOLDER_LIMIT:-26}
    ports: ["${SILO_DEV_SERVER_PORT:-8080}:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      mailserver:
        condition: service_started

  silo-web:
    image: node:22
    working_dir: /src
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../silo-web:/src
      # node_modules w wolumenie kontenera: nie mieszamy modulow hosta (Windows) z Linuksem
      - web_node_modules:/src/node_modules
    environment:
      VITE_API_PROXY: http://silo-server:8080
      # bind mount z Windows nie przekazuje zdarzen plikowych: watcher Vite musi odpytywac
      VITE_USE_POLLING: "1"
    ports: ["${SILO_DEV_WEB_PORT:-5173}:5173"]

volumes:
  pgdata: {}
  blobs: {}
  web_node_modules: {}
  dms-mail: {}
