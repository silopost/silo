# nginx server block for Silo (variant nginx: docker-compose.yml + deploy/nginx/docker-compose.yml), the equivalent of ../caddy/Caddyfile:
# /api/v1/events (SSE) without buffering, /api/* and /healthz -> silo-server, everything else -> silo-web.
# nginx must share a Docker network with the stack (SILO_PROXY_NETWORK), so that the service names resolve.
# Replace silo.example.com (4 places) with the instance domain; certificate: certbot webroot (README.md).
# silo-server sets the API security headers itself; the SPA headers are set here.

server {
	server_name silo.example.com;
	listen 443 ssl;
	http2 on;

	ssl_certificate     /etc/letsencrypt/live/silo.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/silo.example.com/privkey.pem;
	include             /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

	server_tokens off;

	# Docker's embedded DNS. Upstreams in variables are resolved per request, so nginx starts
	# (and reloads) even when the Silo stack is down; such requests get 502 until it is up.
	resolver 127.0.0.11 valid=30s ipv6=off;
	set $silo_server http://silo-server:8080;
	set $silo_web http://silo-web:80;

	# One upload is limited by SILO_MAX_ATTACHMENT_BYTES (default 25MB) plus 1 MiB of form fields;
	# raise this together with it.
	client_max_body_size 32m;

	gzip on;
	gzip_proxied any;
	gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	# silo-server takes the right-most untrusted X-Forwarded-For entry as the client, and trusts
	# the header only from SILO_TRUSTED_PROXIES: send the peer address and drop the client's value.
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-Proto https;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	# SSE: events must arrive immediately (silo-server sends ": ping" every 25 s).
	# proxy_pass with a variable and no URI passes the request URI unchanged.
	location = /api/v1/events {
		proxy_pass $silo_server;
		proxy_buffering off;
		proxy_cache off;
		gzip off;
		proxy_read_timeout 1h;
	}

	location /api/ {
		proxy_pass $silo_server;
		proxy_read_timeout 150s;
	}

	location = /healthz {
		proxy_pass $silo_server;
	}

	location / {
		# Message HTML is in a sandboxed iframe (srcdoc), which inherits this policy:
		# img-src https:/http: allows remote images after clicking "Show images"
		# (blocked by default by the frame's own CSP), data:/blob: - previews and the TOTP QR code.
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		proxy_pass $silo_web;
	}
}

server {
	server_name silo.example.com;
	listen 80;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}
