# Variant "http": the Caddy and Caddyfile of the caddy variant, but plain HTTP on port 8080
# (no TLS, no certificates, no HSTS). For a trusted LAN, a test, or behind a TLS terminator you run
# yourself. WITHOUT TLS, MAILBOX PASSWORDS CROSS THE NETWORK IN CLEARTEXT.
# An overlay for the base docker-compose.yml; relative paths are resolved from the base file's directory.
#   docker compose -f docker-compose.yml -f deploy/http/docker-compose.yml up -d
# Requires SILO_PUBLIC_URL = the address in the browser, e.g. http://192.168.1.10:8080
# (http:// = a session cookie without Secure; https:// when a TLS terminator is in front).
services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      # SILO_HTTP_PORT=127.0.0.1:8080 publishes it on loopback only (e.g. a TLS terminator on the host).
      - "${SILO_HTTP_PORT:-8080}:8080"
    environment:
      # The site address of the Caddyfile: http:// = no automatic HTTPS.
      SILO_SITE_ADDRESS: "http://:8080"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - silo-server
      - silo-web

  silo-server:
    environment:
      SILO_PUBLIC_URL: ${SILO_PUBLIC_URL:?set SILO_PUBLIC_URL in .env (the address in the browser, e.g. http://192.168.1.10:8080)}
