# Variant "caddy" (recommended): Caddy with TLS via ACME on 80/443 (+ UDP 443 for HTTP/3).
# An overlay for the base docker-compose.yml; relative paths are resolved from the base file's directory.
#   docker compose -f docker-compose.yml -f deploy/caddy/docker-compose.yml up -d
# Requires SILO_DOMAIN (a DNS record pointing at this host; localhost = Caddy's internal certificate)
# and open ports 80 and 443. SILO_PUBLIC_URL defaults to https://$SILO_DOMAIN.
services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "${SILO_HTTP_PORT:-80}:80"
      - "${SILO_HTTPS_PORT:-443}:443"
      - "${SILO_HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      # The site address of the Caddyfile: a domain = automatic HTTPS.
      SILO_SITE_ADDRESS: ${SILO_DOMAIN:?set SILO_DOMAIN in .env (e.g. mail.example.com)}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # ACME certificates
      - caddy-config:/config
    depends_on:
      - silo-server
      - silo-web

volumes:
  caddy-data: {}
  caddy-config: {}
