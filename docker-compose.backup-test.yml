# A separate stack for the backup and restore test (phase 5 definition of done): scripts/e2e-backup-restore.sh.
# Its own project (silo-bt), volumes and host ports: it does not collide with the dev stack.
# silo-server in the production image (--target prod, distroless, nonroot), without silo-web.
# Requires the sibling repository ../silo-server.
name: silo-bt

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: silo
      POSTGRES_PASSWORD: silo # test only
      POSTGRES_DB: silo
    ports: ["${SILO_BT_PG_PORT:-15432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # -h 127.0.0.1: the temporary server of the initdb stage listens only on the socket, so it is not "ready"
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "silo", "-d", "silo"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Mail server as in dev (the same configuration and accounts dev1-3@silo.test), its own volume.
  # In the test it plays the role of the external IMAP server: its volume survives the "loss" of Silo.
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:16
    hostname: mail.silo.test
    environment:
      ENABLE_RSPAMD: "0"
      ENABLE_SPAMASSASSIN: "0"
      ENABLE_CLAMAV: "0"
      ENABLE_AMAVIS: "0"
      ENABLE_OPENDKIM: "0"
      ENABLE_OPENDMARC: "0"
      ENABLE_POLICYD_SPF: "0"
      ENABLE_FAIL2BAN: "0"
      PERMIT_DOCKER: network
      SSL_TYPE: ""
    volumes:
      - ./dev/dms/config:/tmp/docker-mailserver
      - dms-mail:/var/mail
    ports:
      - "${SILO_BT_SMTP_PORT:-12525}:25"
      - "${SILO_BT_IMAP_PORT:-11143}:143"
      - "${SILO_BT_SUBMISSION_PORT:-11587}:587"

  # The prod image runs as nonroot (65532): a new blob volume has to be handed over to it.
  blobs-init:
    image: alpine:3.22
    command: ["chown", "-R", "65532:65532", "/data/blobs"]
    volumes: [blobs:/data/blobs]

  silo-server:
    build:
      context: ../silo-server
      target: prod
    volumes: [blobs:/data/blobs]
    environment:
      SILO_HTTP_ADDR: ":8080"
      SILO_LOG_FORMAT: text
      SILO_LOG_LEVEL: info
      SILO_DATABASE_URL: postgres://silo:silo@postgres:5432/silo?sslmode=disable
      SILO_PUBLIC_URL: http://localhost:${SILO_BT_SERVER_PORT:-18080}
      SILO_SECRET_KEY: ZGV2LW9ubHktZGV2LW9ubHktZGV2LW9ubHktZGV2MzI= # 32 B base64, test ONLY
      SILO_AUTH_MODE: imap
      SILO_DEFAULT_IMAP_HOST: mailserver
      SILO_DEFAULT_IMAP_PORT: "143"
      SILO_DEFAULT_IMAP_TLS: none
      SILO_DEFAULT_SMTP_HOST: mailserver
      SILO_DEFAULT_SMTP_PORT: "587"
      SILO_DEFAULT_SMTP_TLS: none
      SILO_ALLOW_INSECURE_TRANSPORT: "true"
      SILO_UNDO_WINDOW: 1s # operations reach the IMAP server right away, so the backup does not lose them
    restart: on-failure # as in production: a temporarily missing database does not stop the stack
    ports: ["${SILO_BT_SERVER_PORT:-18080}:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      mailserver:
        condition: service_started
      blobs-init:
        condition: service_completed_successfully

volumes:
  pgdata: {}
  blobs: {}
  dms-mail: {}
