name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    name: validate compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          docker compose -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.backup-test.yml config -q
          docker compose -f docker-compose.backup-test.yml -f docker-compose.local-auth.yml config -q
          # stos produkcyjny: .env.example jako plik zmiennych (pusty klucz i haslo przechodza config)
          docker compose --env-file .env.example -f docker-compose.yml config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.build.yml config -q
      - name: caddy validate
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -e SILO_DOMAIN=example.com caddy:2.10 caddy validate --config /etc/caddy/Caddyfile

  lint:
    name: lint yaml and markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' docker-compose.yml docker-compose.build.yml docker-compose.dev.yml docker-compose.backup-test.yml docker-compose.local-auth.yml .github
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            docs/**/*.md
          config: .markdownlint.yaml

  shellcheck:
    name: shellcheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
