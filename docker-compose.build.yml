# Overlay for docker-compose.yml: images built from the sibling repositories (../silo-server, ../silo-web)
# instead of ghcr.io - before images are published, or to test the production stack (smoke):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  silo-server:
    image: silopost-local/silo-server:build
    build:
      context: ../silo-server
      target: prod

  silo-web:
    image: silopost-local/silo-web:build
    build:
      context: ../silo-web
