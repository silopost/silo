# Stos produkcyjny (plan 2.1): caddy (TLS, 80/443) + postgres + silo-server + silo-web.
# Serwer poczty jest zewnetrzny (docker-mailserver w innym compose albo dowolny dostawca).
# Konfiguracja: .env (kopia .env.example, sekcja "Produkcja"); instrukcja: docs/admin/README.md.
#   docker compose up -d                  # pierwsze uruchomienie: migracje przy starcie silo-server
#   docker compose pull && docker compose up -d   # upgrade po zmianie SILO_SERVER_TAG/SILO_WEB_TAG
# Budowa z repo-rodzenstwa zamiast obrazow ghcr: -f docker-compose.yml -f docker-compose.build.yml.
name: silo-prod # inna nazwa niz stos dev (projekt "silo"), zeby nie dzielic wolumenow

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "${SILO_HTTP_PORT:-80}:80"
      - "${SILO_HTTPS_PORT:-443}:443"
      - "${SILO_HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      SILO_DOMAIN: ${SILO_DOMAIN:?ustaw SILO_DOMAIN w .env (np. poczta.example.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certyfikaty ACME
      - caddy-config:/config
    depends_on:
      - silo-server
      - silo-web

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: silo
      # Bez znakow wymagajacych kodowania w URL (openssl rand -hex 24); puste = postgres nie wystartuje.
      POSTGRES_PASSWORD: ${SILO_POSTGRES_PASSWORD?ustaw SILO_POSTGRES_PASSWORD w .env}
      POSTGRES_DB: silo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # -h 127.0.0.1: tymczasowy serwer z etapu initdb slucha tylko na sockecie, wiec nie jest "gotowy"
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "silo", "-d", "silo"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Obraz silo-server dziala jako nonroot (65532): nowy wolumen blobow trzeba mu oddac na wlasnosc.
  blobs-init:
    image: alpine:3.22
    command: ["chown", "-R", "65532:65532", "/data/blobs"]
    volumes: [blobs:/data/blobs]

  silo-server:
    image: ghcr.io/silopost/silo-server:${SILO_SERVER_TAG:-0.5.0}
    restart: unless-stopped
    # Wszystkie SILO_* z .env (SILO_SECRET_KEY, SILO_AUTH_MODE, SILO_DEFAULT_*, SILO_OAUTH_*, ...).
    env_file:
      - path: ${SILO_ENV_FILE:-.env}
        required: false
    environment:
      SILO_HTTP_ADDR: ":8080"
      SILO_DATABASE_URL: postgres://silo:${SILO_POSTGRES_PASSWORD-}@postgres:5432/silo?sslmode=disable
      SILO_PUBLIC_URL: ${SILO_PUBLIC_URL:-https://${SILO_DOMAIN:-localhost}}
      SILO_BLOB_FS_DIR: /data/blobs
      # Caddy laczy sie z sieci compose: tylko z niej honorowane sa X-Forwarded-For (Hardening).
      SILO_TRUSTED_PROXIES: ${SILO_TRUSTED_PROXIES:-${SILO_NETWORK_SUBNET:-172.29.250.0/24}}
    volumes: [blobs:/data/blobs]
    # Bez portow na hoscie: ruch tylko przez Caddy.
    depends_on:
      postgres:
        condition: service_healthy
      blobs-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

  # Statyczny build SPA serwowany przez nginx w obrazie (port 80 w sieci compose).
  silo-web:
    image: ghcr.io/silopost/silo-web:${SILO_WEB_TAG:-0.4.0}
    restart: unless-stopped

networks:
  default:
    ipam:
      # Stala podsiec, zeby SILO_TRUSTED_PROXIES wskazywalo adres Caddy; zmien przy kolizji.
      config:
        - subnet: ${SILO_NETWORK_SUBNET:-172.29.250.0/24}

volumes:
  pgdata: {}
  blobs: {}
  caddy-data: {}
  caddy-config: {}
