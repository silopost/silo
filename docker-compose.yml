# Production stack: caddy (TLS, 80/443) + postgres + silo-server + silo-web.
# The mail server is external (docker-mailserver in another compose project or any provider).
# Configuration: .env (a copy of .env.example, "Production" section); guide: docs/admin/README.md.
#   docker compose up -d                  # first start: migrations at silo-server start-up
#   docker compose pull && docker compose up -d   # upgrade after changing SILO_SERVER_TAG/SILO_WEB_TAG
# Build from the sibling repositories instead of ghcr images: -f docker-compose.yml -f docker-compose.build.yml.
name: silo-prod # a different name than the dev stack (project "silo"), so that volumes are not shared

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "${SILO_HTTP_PORT:-80}:80"
      - "${SILO_HTTPS_PORT:-443}:443"
      - "${SILO_HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      SILO_DOMAIN: ${SILO_DOMAIN:?ustaw SILO_DOMAIN w .env (np. poczta.example.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # ACME certificates
      - caddy-config:/config
    depends_on:
      - silo-server
      - silo-web

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: silo
      # No characters that need URL encoding (openssl rand -hex 24); empty = postgres will not start.
      POSTGRES_PASSWORD: ${SILO_POSTGRES_PASSWORD?ustaw SILO_POSTGRES_PASSWORD w .env}
      POSTGRES_DB: silo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # -h 127.0.0.1: the temporary server of the initdb stage listens only on the socket, so it is not "ready"
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "silo", "-d", "silo"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The silo-server image runs as nonroot (65532): a new blob volume has to be handed over to it.
  blobs-init:
    image: alpine:3.22
    command: ["chown", "-R", "65532:65532", "/data/blobs"]
    volumes: [blobs:/data/blobs]

  silo-server:
    image: ghcr.io/silopost/silo-server:${SILO_SERVER_TAG:-0.5.0}
    restart: unless-stopped
    # All SILO_* from .env (SILO_SECRET_KEY, SILO_AUTH_MODE, SILO_DEFAULT_*, SILO_OAUTH_*, ...).
    env_file:
      - path: ${SILO_ENV_FILE:-.env}
        required: false
    environment:
      SILO_HTTP_ADDR: ":8080"
      SILO_DATABASE_URL: postgres://silo:${SILO_POSTGRES_PASSWORD-}@postgres:5432/silo?sslmode=disable
      SILO_PUBLIC_URL: ${SILO_PUBLIC_URL:-https://${SILO_DOMAIN:-localhost}}
      SILO_BLOB_FS_DIR: /data/blobs
      # Caddy connects from the compose network: X-Forwarded-For is honored only from it (Hardening).
      SILO_TRUSTED_PROXIES: ${SILO_TRUSTED_PROXIES:-${SILO_NETWORK_SUBNET:-172.29.250.0/24}}
    volumes: [blobs:/data/blobs]
    # No host ports: traffic only through Caddy.
    depends_on:
      postgres:
        condition: service_healthy
      blobs-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

  # Static SPA build served by nginx inside the image (port 80 on the compose network).
  silo-web:
    image: ghcr.io/silopost/silo-web:${SILO_WEB_TAG:-0.4.0}
    restart: unless-stopped

networks:
  default:
    ipam:
      # A fixed subnet, so that SILO_TRUSTED_PROXIES points at Caddy's address; change it on a collision.
      config:
        - subnet: ${SILO_NETWORK_SUBNET:-172.29.250.0/24}

volumes:
  pgdata: {}
  blobs: {}
  caddy-data: {}
  caddy-config: {}
