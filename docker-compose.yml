# Production stack, the base shared by every variant: postgres + silo-server + silo-web, no proxy
# and no host ports. Run it together with ONE variant overlay (README.md, "Quick start: production"):
#   docker compose -f docker-compose.yml -f deploy/caddy/docker-compose.yml up -d   # Caddy, HTTPS on 80/443
#   docker compose -f docker-compose.yml -f deploy/http/docker-compose.yml up -d    # Caddy, plain HTTP on 8080
#   docker compose -f docker-compose.yml -f deploy/nginx/docker-compose.yml up -d   # an existing nginx
# Shortcut: COMPOSE_FILE in .env (.env.example), then a plain `docker compose up -d`.
# Images built from the sibling repositories instead of ghcr: add -f docker-compose.build.yml.
# The mail server is external (docker-mailserver in another compose project or any provider).
# Configuration: .env (a copy of .env.example, "Production" section); guide: docs/admin/README.md.
name: silo-prod # a different name than the dev stack (project "silo"), so that volumes are not shared

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: silo
      # No characters that need URL encoding (openssl rand -hex 24); empty = postgres will not start.
      POSTGRES_PASSWORD: ${SILO_POSTGRES_PASSWORD?set SILO_POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
      POSTGRES_DB: silo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # -h 127.0.0.1: the temporary server of the initdb stage listens only on the socket, so it is not "ready"
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "silo", "-d", "silo"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The silo-server image runs as nonroot (65532): a new blob volume has to be handed over to it.
  blobs-init:
    image: alpine:3.22
    command: ["chown", "-R", "65532:65532", "/data/blobs"]
    volumes: [blobs:/data/blobs]

  silo-server:
    image: ${SILO_SERVER_IMAGE:-ghcr.io/silopost/silo-server}:${SILO_SERVER_TAG:-0.8.0}
    restart: unless-stopped
    # All SILO_* from .env (SILO_SECRET_KEY, SILO_AUTH_MODE, SILO_DEFAULT_*, SILO_OAUTH_*, ...).
    env_file:
      - path: ${SILO_ENV_FILE:-.env}
        required: false
    environment:
      SILO_HTTP_ADDR: ":8080"
      SILO_DATABASE_URL: postgres://silo:${SILO_POSTGRES_PASSWORD-}@postgres:5432/silo?sslmode=disable
      # The address in the browser. Variant caddy: defaults to https://$SILO_DOMAIN;
      # variants http and nginx require it.
      SILO_PUBLIC_URL: ${SILO_PUBLIC_URL:-https://${SILO_DOMAIN:-localhost}}
      SILO_BLOB_FS_DIR: /data/blobs
      # Caddy (variants caddy and http) connects from the compose network: X-Forwarded-For is
      # honored only from it (Hardening). The nginx variant sets the subnet of its proxy network.
      SILO_TRUSTED_PROXIES: ${SILO_TRUSTED_PROXIES:-${SILO_NETWORK_SUBNET:-172.29.250.0/24}}
    volumes: [blobs:/data/blobs]
    # No host ports: traffic only through the proxy of the variant.
    depends_on:
      postgres:
        condition: service_healthy
      blobs-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

  # Static SPA build served by nginx inside the image (port 80). It does not proxy /api:
  # the proxy of the variant routes /api to silo-server.
  silo-web:
    image: ${SILO_WEB_IMAGE:-ghcr.io/silopost/silo-web}:${SILO_WEB_TAG:-0.7.0}
    restart: unless-stopped

networks:
  default:
    ipam:
      # A fixed subnet, so that SILO_TRUSTED_PROXIES points at Caddy's address; change it on a collision.
      config:
        - subnet: ${SILO_NETWORK_SUBNET:-172.29.250.0/24}

volumes:
  pgdata: {}
  blobs: {}
